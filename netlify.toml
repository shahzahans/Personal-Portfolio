[build]
  publish = "."
  functions = "netlify/functions"

# Functions run on the build's Node version; the passkey library needs Node 20+
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The private update page should never be indexed or cached
[[headers]]
  for = "/update.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
